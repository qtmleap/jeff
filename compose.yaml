name: jeff-cuda
services:
  jeff:
    image: ${JEFF_IMAGE:-ghcr.io/qtmleap/jeff:latest}
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      JEFF_BACKEND: pytorch
      JEFF_DEVICE: cuda
      JEFF_MODEL_REPO: ${JEFF_MODEL_REPO:-mstrasser/Jeff-Qwen3.5-2B}
      JEFF_MODEL_REVISION: ${JEFF_MODEL_REVISION:-main}
      JEFF_HOST: 0.0.0.0
      PORT: "8765"
    volumes:
      - type: volume
        source: models
        target: /models
      - type: volume
        source: compile-cache
        target: /cache
    read_only: true
    tmpfs:
      - /tmp:rw,exec,size=1g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  models:
  compile-cache:
