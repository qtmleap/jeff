name: jeff-cuda
services:
  jeff:
    image: ${JEFF_IMAGE:-ghcr.io/qtmleap/jeff:branch-feat-cuda-docker}
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${JEFF_HTTP_PORT:-8766}:8765"
    environment:
      JEFF_BACKEND: pytorch
      JEFF_DEVICE: cuda
      JEFF_CHECKPOINT: /models/jeff-2b
      JEFF_HOST: 0.0.0.0
      PORT: "8765"
    volumes:
      - type: bind
        source: ${JEFF_MODEL_DIR:?Set JEFF_MODEL_DIR to the absolute checkpoint directory}
        target: /models/jeff-2b
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: compile-cache
        target: /cache
    read_only: true
    tmpfs:
      - /tmp:rw,exec,size=1g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  compile-cache:
